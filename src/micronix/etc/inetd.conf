#
# /etc/inetd.conf - the internet super server's table
#
# service	program [args...]
#
# The service is a name in /etc/services (tcp) or a port number.
# inetd appends -i, the caller's dotted quad and its own pid; the
# program takes the connection on fd 0 and kills the pid when done.
#
# Under d1 the ports in /etc/services are bound on the host, so a
# simulated machine uses numbers instead of names to keep them off the
# host's own daemons - for example:
#
#	5514	/bin/rshd
#	5513	/bin/rlogind
#	5523	/bin/telnetd
#	5521	/bin/ftpd
#
shell		/bin/rshd
login		/bin/rlogind
telnet		/bin/telnetd
ftp		/bin/ftpd
