;
; The ESP32 network card firmware.
;
; build:  pio run          (or just "make" here)
; flash:  pio run -t upload
; watch:  pio device monitor
;
; The board is the ESP32-DOIT DEVKIT V1 from the card document; the
; pinout is in include/netproto.h and src/main.cpp.
;
[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
